name: Refresh and deploy Thailand Power Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: '10 8 * * 1'
      timezone: 'Asia/Bangkok'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thailand-power-pulse-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Refresh live data and rebuild dashboard
        run: |
          chmod +x run_weekly.sh
          ./run_weekly.sh

      - name: Persist refreshed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Weekly Thailand Power Pulse refresh $(date -u +%F)"
            git push
          fi

      - name: Prepare static site
        run: |
          rm -rf site
          mkdir -p site
          cp data/thailand_power_renewables_pulse_live.html site/index.html
          cp data/dashboard_data.json site/dashboard_data.json
          cp data/provenance_audit.csv site/provenance_audit.csv
          cp public_figure_manifest.json site/public_figure_manifest.json
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
